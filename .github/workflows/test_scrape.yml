name: Test Playwright Scrape

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install playwright
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Run scrape test
        run: python test_scrape.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: |
            result.json
            chart_all_data.json
            chip_all_data.json

      - name: Commit data to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          cp result.json data/
          cp chart_all_data.json data/
          cp chip_all_data.json data/
          git add data/
          git commit -m "更新饰品抓取数据 $(date -u '+%Y-%m-%d %H:%M')" || echo "无变更"
          git push
