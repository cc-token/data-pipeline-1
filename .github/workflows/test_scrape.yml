name: Test Playwright Scrape

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install playwright
        run: |
          pip install playwright
          # 使用 python -m playwright 安装浏览器（与 Python 包匹配）
          python -m playwright install chromium

      - name: Run scrape test
        run: python test_scrape.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: |
            result.json
            chart_all_data.json
            chip_all_data.json
